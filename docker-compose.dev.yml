version: '3.8'

# Development ortamı için Docker Compose
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: siea-postgres-dev
    environment:
      POSTGRES_DB: siea_db_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - siea-dev-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: siea-redis-dev
    ports:
      - "6380:6379"
    networks:
      - siea-dev-network

  # pgAdmin (Database Management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: siea-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@siea.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - siea-dev-network

volumes:
  postgres_dev_data:

networks:
  siea-dev-network:
    driver: bridge
